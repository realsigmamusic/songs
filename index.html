<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Sigma Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-secondary">  
    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-center align-items-center gap-4 pb-4 bg-body-secondary flex-wrap">    
            <div class="btn-group shadow-sm">
                <button class="btn btn-sm btn-outline-warning" onclick="mudarTamanhoFonte(-10)">A-</button>
                <button class="btn btn-sm btn-outline-warning" onclick="resetarFonte()">Fonte</button>
                <button class="btn btn-sm btn-outline-warning" onclick="mudarTamanhoFonte(10)">A+</button>
            </div>
            <div class="btn-group shadow-sm">
                <button class="btn btn-sm btn-outline-primary fw-bold" onclick="mudarTom(-1)">- ½</button>
                <button class="btn btn-sm btn-outline-primary" onclick="resetarTom()">Tom</button>
                <button class="btn btn-sm btn-outline-primary fw-bold" onclick="mudarTom(1)">+ ½</button>
            </div>
        </div>
        <div id="chord-container" class="chord-sheet bg-body-tertiary p-3 mx-1 rounded shadow-sm"></div>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
